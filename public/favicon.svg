<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Retro Pixel Robot Icon -->
  <!-- Antenna -->
  <rect x="7" y="1" width="2" height="1" fill="#5cffc8" />
  <rect x="7" y="2" width="2" height="2" fill="#a855f7" />
  <!-- Head outline -->
  <rect x="3" y="4" width="10" height="9" fill="#1b1533" stroke="#3b2f66" stroke-width="1" />
  <rect x="2" y="6" width="1" height="5" fill="#a855f7" />
  <rect x="13" y="6" width="1" height="5" fill="#a855f7" />
  <!-- Eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#5cffc8" />
  <rect x="9" y="6" width="2" height="2" fill="#5cffc8" />
  <!-- Mouth / grid -->
  <rect x="5" y="10" width="6" height="1" fill="#ffd36e" />
  <rect x="6" y="11" width="4" height="1" fill="#ffd36e" />
  <!-- Chin -->
  <rect x="6" y="13" width="4" height="1" fill="#3b2f66" />
</svg>
